name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # packages/web-public imports shared code from the sibling
      # packages/core directory via relative paths (e.g. "../core/src/...").
      # The whole packages/ tree is uploaded together, not just web-public,
      # so those imports still resolve once deployed. This is also why the
      # site now lives at <pages-url>/web-public/ instead of the repo root.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages
      - id: deployment
        uses: actions/deploy-pages@v4
